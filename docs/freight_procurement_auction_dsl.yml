            \  \"legs\": [\n    {\n      \"leg_number\": 1,\n      \"mode\": \"road\"\
            ,\n      \"from\": \"Origin Facility, Netherlands\",\n      \"to\": \"\
            Port of Rotterdam Terminal APM-2\",\n      \"distance_km\": 110,\n   \
            \   \"transit_days\": 0.5,\n      \"constraints\": [\"Pre-carriage appointment\
            \ slot\", \"GDP reefer trailer monitoring\"],\n      \"documentation\"\
            : [\"CMR Waybill\", \"Packing List\", \"Pharma Release Certificate\"]\n\
            \    },\n    {\n      \"leg_number\": 2,\n      \"mode\": \"sea\",\n \
            \     \"from\": \"Port of Rotterdam\",\n      \"to\": \"Port of Shanghai\
            \ (Yangshan Deepwater)\",\n      \"distance_km\": 19500,\n      \"transit_days\"\
            : 26.0,\n      \"constraints\": [\"Hague-Visby liability rules\", \"Active\
            \ reefer container plug-in logs\", \"Suez or Cape bypass clearance\"],\n\
            \      \"documentation\": [\"Ocean Bill of Lading\", \"Commercial Invoice\"\
            , \"Dangerous Goods Declaration if applicable\"]\n    },\n    {\n    \
            \  \"leg_number\": 3,\n      \"mode\": \"road\",\n      \"from\": \"Port\
            \ of Shanghai\",\n      \"to\": \"Pudong High-Tech Manufacturing Plant\"\
            ,\n      \"distance_km\": 75,\n      \"transit_days\": 0.5,\n      \"\
            constraints\": [\"Customs bonded clearance corridor\", \"Air-ride suspension\
            \ truck\"],\n      \"documentation\": [\"Customs Import Declaration\"\
            , \"Inland Delivery Order\"]\n    }\n  ],\n  \"total_estimated_transit_days\"\
            : 27.0,\n  \"critical_bottlenecks\": [\"Ocean terminal congestion\", \"\
            Customs clearance inspections\"],\n  \"recommended_carrier_alliances\"\
            : [\"Ocean Carrier Alliance\", \"Multi-modal 3PL Forwarder\"]\n}"
        - role: user
