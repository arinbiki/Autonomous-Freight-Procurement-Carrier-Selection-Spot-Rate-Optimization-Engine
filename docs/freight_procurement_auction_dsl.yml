          \ = []\n    cumulative = 0.0\n    \n    for y in range(1, 4):\n        fuel_factor\
          \ = (1.0 + 0.06) ** (y - 1)\n        labor_factor = (1.0 + 0.04) ** (y -\
          \ 1)\n        inflation_factor = (1.0 + 0.025) ** (y - 1)\n        \n  \
          \      composite_escalation = (0.40 * fuel_factor) + (0.30 * labor_factor)\
          \ + (0.30 * inflation_factor)\n        annual_cost = winning_bid * annual_volume\
          \ * composite_escalation\n        cumulative += annual_cost\n        \n\
          \        yearly_projections.append({\n            'year': y,\n         \
          \   'rate_per_shipment_usd': round(winning_bid * composite_escalation, 2),\n\
          \            'annual_total_usd': round(annual_cost, 2),\n            'cumulative_usd':\
          \ round(cumulative, 2),\n            'composite_escalation_pct': round((composite_escalation\
          \ - 1.0) * 100, 2)\n        })\n        \n    total_3yr = cumulative\n \
          \   # Net Present Value discounted at 8% per annum\n    npv_3yr = (\n  \
          \      yearly_projections[0]['annual_total_usd'] / (1.08 ** 1) +\n     \
