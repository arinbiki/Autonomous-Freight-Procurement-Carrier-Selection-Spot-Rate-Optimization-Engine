    - data:
        code: "def main(auction_strategy_raw: str, should_cost: float, market_rate:\
          \ float, carriers_raw: list) -> dict:\n    # Bertrand Competition Model\
          \ with 5 Progressive Rounds\n    # Bid_c = Base_Cost_c * (1 + Margin * (1\
          \ - Aggressiveness * Round_Factor))\n    # Spread = (Highest_Bid - Lowest_Bid)\
          \ / Lowest_Bid * 100\n    \n    carriers = [c['carrier_name'] if isinstance(c,\
          \ dict) else str(c) for c in carriers_raw] if carriers_raw else ['Maersk\
          \ Line', 'Hapag-Lloyd', 'CMA CGM']\n    \n    # Carrier strategic parameter\
          \ profiles:\n    profiles = {\n        'Maersk Line': {'base_cost_ratio':\
          \ 0.94, 'capacity_util': 0.68, 'relationship': 0.85},\n        'Hapag-Lloyd':\
          \ {'base_cost_ratio': 0.96, 'capacity_util': 0.72, 'relationship': 0.90},\n\
          \        'CMA CGM': {'base_cost_ratio': 0.92, 'capacity_util': 0.60, 'relationship':\
          \ 0.70},\n        'ONE (Ocean Network Express)': {'base_cost_ratio': 0.95,\
          \ 'capacity_util': 0.75, 'relationship': 0.75}\n    }\n    \n    rounds_history\
          \ = []\n    current_bids = {}\n    \n    # Initialize Round 1 bids near\
          \ market benchmark\n    for c in carriers:\n        p = profiles.get(c,\
          \ {'base_cost_ratio': 0.95, 'capacity_util': 0.70, 'relationship': 0.80})\n\
          \        current_bids[c] = round(market_rate * (1.02 - (1 - p['capacity_util'])\
          \ * 0.05), 2)\n        \n    for r in range(1, 6):\n        round_bids =\
          \ []\n        for c in carriers:\n            p = profiles.get(c, {'base_cost_ratio':\
          \ 0.95, 'capacity_util': 0.70, 'relationship': 0.80})\n            cost_floor\
          \ = should_cost * p['base_cost_ratio'] * 1.02 # Won't bid below cost + 2%\n\
          \            \n            # Concession velocity increases with rounds\n\
          \            concession_step = (current_bids[c] - cost_floor) * (0.18 +\
          \ 0.04 * r)\n            new_bid = max(current_bids[c] - concession_step,\
          \ cost_floor)\n            current_bids[c] = round(new_bid, 2)\n       \
          \     \n            round_bids.append({\n                'carrier': c,\n\
          \                'bid_usd': current_bids[c],\n                'discount_off_market_pct':\
          \ round(((market_rate - current_bids[c]) / market_rate) * 100, 2)\n    \
          \        })\n            \n        round_bids.sort(key=lambda x: x['bid_usd'])\n\
          \        lowest_bid = round_bids[0]['bid_usd']\n        highest_bid = round_bids[-1]['bid_usd']\n\
          \        spread = round(((highest_bid - lowest_bid) / lowest_bid) * 100,\
          \ 2)\n        \n        rounds_history.append({\n            'round': r,\n\
          \            'bids': round_bids,\n            'best_bid': round_bids[0],\n\
          \            'spread_pct': spread,\n            'converged': spread < 5.0\
          \ or r == 5\n        })\n        \n    final_round = rounds_history[-1]\n\
          \    winner = final_round['best_bid']\n    runner_up = final_round['bids'][1]\
          \ if len(final_round['bids']) > 1 else winner\n    \n    total_savings =\
          \ market_rate - winner['bid_usd']\n    savings_pct = round((total_savings\
          \ / market_rate) * 100, 2)\n    \n    return {\n        'rounds_executed':\
          \ len(rounds_history),\n        'winning_carrier': winner['carrier'],\n\
          \        'winning_bid_usd': winner['bid_usd'],\n        'runner_up_carrier':\
          \ runner_up['carrier'],\n        'runner_up_bid_usd': runner_up['bid_usd'],\n\
          \        'final_spread_pct': final_round['spread_pct'],\n        'total_savings_usd':\
          \ round(total_savings, 2),\n        'savings_pct': savings_pct,\n      \
          \  'final_bids_ranking': final_round['bids'],\n        'auction_rounds_history':\
          \ rounds_history,\n        'auction_summary': f\"Winner: {winner['carrier']}\
          \ at ${winner['bid_usd']:,.2f} (Savings: ${total_savings:,.2f} / {savings_pct}%\
          \ vs market). Final Spread: {final_round['spread_pct']}%\"\n    }\n"
        code_language: python3
