    - data:
        code: "def main(total_3yr_tco: float) -> dict:\n    import random\n    random.seed(42)\
          \ # Reproducible seed for audit integrity\n    \n    simulations = []\n\
          \    for _ in range(1000):\n        fuel_shock = random.gauss(0.0, 0.08)\
          \ # +/-8% bunker fuel volatility\n        fx_shift = random.gauss(0.0, 0.05)\
          \ # +/-5% EUR/USD/CNY currency fluctuation\n        volume_variance = random.gauss(0.0,\
          \ 0.09) # +/-9% cargo volume delta\n        demand_spike = 1.18 if random.random()\
          \ < 0.06 else 1.0 # 6% probability of macro port backlog surge\n       \
          \ \n        sim_factor = (1.0 + fuel_shock * 0.40) * (1.0 + fx_shift * 0.25)\
          \ * (1.0 + volume_variance) * demand_spike\n        simulations.append(total_3yr_tco\
          \ * sim_factor)\n        \n    simulations.sort()\n    \n    p10 = simulations[100]\n\
          \    p50 = simulations[500]\n    p90 = simulations[900]\n    mean_val =\
          \ sum(simulations) / len(simulations)\n    std_dev = (sum((x - mean_val)\
          \ ** 2 for x in simulations) / len(simulations)) ** 0.5\n    p90_premium_pct\
          \ = ((p90 - total_3yr_tco) / total_3yr_tco) * 100\n    \n    return {\n\
          \        'monte_carlo_p10_usd': round(p10, 2),\n        'monte_carlo_p50_usd':\
          \ round(p50, 2),\n        'monte_carlo_p90_usd': round(p90, 2),\n      \
          \  'monte_carlo_mean_usd': round(mean_val, 2),\n        'monte_carlo_std_dev':\
          \ round(std_dev, 2),\n        'p90_risk_premium_pct': round(p90_premium_pct,\
          \ 2),\n        'monte_carlo_summary': f\"P10: ${p10:,.2f} | P50 (Median):\
          \ ${p50:,.2f} | P90 (Worst 10%): ${p90:,.2f} (+{p90_premium_pct:.1f}% risk\
          \ premium)\"\n    }\n"
