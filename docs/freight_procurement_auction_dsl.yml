    - data:
        code: "def main(distance_km: float, weight_kg: float, volume_cbm: float, temp_req:\
          \ str, hazmat: str) -> dict:\n    # Mathematical Bottom-Up Cost Breakdown:\n\
          \    # Should_Cost = Base_Fuel + Labor + Equipment + Insurance + Accessorials\
          \ + Overhead(15%) + Margin(12%)\n    \n    # 1. Fuel consumption (Ocean\
          \ + Inland legs blend)\n    bunker_fuel_metric_tons = (distance_km / 1000.0)\
          \ * 1.85\n    bunker_price_per_ton = 580.0 # VLSFO bunker benchmark USD/ton\n\
          \    fuel_cost = bunker_fuel_metric_tons * bunker_price_per_ton\n    \n\
          \    # 2. Port & Terminal handling fees (THC Rotterdam + THC Shanghai)\n\
          \    terminal_handling_charges = 950.0 + 820.0\n    \n    # 3. Labor & Crew\
          \ allocation\n    crew_labor_cost = 620.0 + (distance_km / 1000.0) * 45.0\n\
          \    \n    # 4. Equipment depreciation & reefer genset maintenance\n   \
          \ equipment_cost = 450.0 + (weight_kg * 0.04)\n    \n    # 5. Accessorials\n\
          \    accessorials = 0.0\n    if \"Ambient\" in temp_req or \"Frozen\" in\
          \ temp_req or \"Cryogenic\" in temp_req:\n        accessorials += 850.0\
          \ # Active Reefer PTI inspection & continuous plug-in monitoring\n    if\
          \ \"Class\" in hazmat:\n        accessorials += 650.0 # IMDG hazmat stowage\
          \ & segregator surcharge\n        \n    # 6. Cargo insurance baseline (0.25%\
          \ of assumed valuation)\n    cargo_value_est = weight_kg * 120.0 # ~$120/kg\
          \ for optical/semiconductor equipment\n    insurance = cargo_value_est *\
          \ 0.0025\n    \n    subtotal = fuel_cost + terminal_handling_charges + crew_labor_cost\
          \ + equipment_cost + accessorials + insurance\n    overhead = subtotal *\
          \ 0.15 # 15% corporate overhead\n    baseline_margin = subtotal * 0.12 #\
          \ 12% carrier target margin\n    \n    should_cost = subtotal + overhead\
          \ + baseline_margin\n    market_benchmark = should_cost * 1.14 # Market\
          \ spot rate is ~14% above baseline should-cost\n    reserve_price = market_benchmark\
          \ * 1.10 # Ceiling reservation price (maximum buyer will tolerate)\n   \
          \ \n    return {\n        'should_cost_usd': round(should_cost, 2),\n  \
          \      'market_benchmark_usd': round(market_benchmark, 2),\n        'reserve_price_usd':\
          \ round(reserve_price, 2),\n        'fuel_component': round(fuel_cost, 2),\n\
          \        'terminal_handling': round(terminal_handling_charges, 2),\n   \
          \     'labor_component': round(crew_labor_cost, 2),\n        'accessorials_total':\
          \ round(accessorials, 2),\n        'insurance_component': round(insurance,\
          \ 2),\n        'overhead_component': round(overhead, 2),\n        'target_margin_usd':\
          \ round(baseline_margin, 2),\n        'cost_model_summary': f\"Should-Cost:\
          \ ${should_cost:,.2f} | Market Benchmark: ${market_benchmark:,.2f} | Reserve\
          \ Price: ${reserve_price:,.2f}\"\n    }\n"
