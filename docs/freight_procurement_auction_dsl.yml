            \ JSON:\n{\n  \"rate_query\": \"ocean container rates Rotterdam to Shanghai\
            \ 40ft reefer BAF\",\n  \"performance_query\": \"carrier SLA on-time arrival\
            \ Shanghai East Asia route claims ratio\",\n  \"contract_query\": \"master\
            \ service agreement carrier liability limits cold chain demurrage\",\n\
