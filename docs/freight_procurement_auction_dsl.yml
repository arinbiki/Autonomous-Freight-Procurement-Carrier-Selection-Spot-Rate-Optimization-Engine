    - data:
        code: "def main(param_raw: str, journey_raw: str, origin: str, destination:\
          \ str, cargo_desc: str, weight: float, volume: float, temp_req: str, hazmat:\
          \ str, deadline: str, incoterms: str, urgency: str) -> dict:\n    import\
          \ json, re\n    \n    def parse_json(raw_str):\n        try:\n         \
          \   m = re.search(r'\\{.*\\}', raw_str, re.DOTALL)\n            if m:\n\
          \                return json.loads(m.group(0))\n            return json.loads(raw_str)\n\
          \        except Exception:\n            return {}\n            \n    params\
          \ = parse_json(param_raw)\n    journey = parse_json(journey_raw)\n    \n\
          \    legs = journey.get(\"legs\", [])\n    if not legs:\n        legs =\
          \ [\n            {\"leg_number\": 1, \"mode\": \"road\", \"from\": origin,\
          \ \"to\": \"Hub Terminal\", \"distance_km\": 120, \"transit_days\": 0.5},\n\
          \            {\"leg_number\": 2, \"mode\": \"sea\", \"from\": \"Hub Terminal\"\
          , \"to\": \"Destination Port\", \"distance_km\": 19000, \"transit_days\"\
          : 25.0},\n            {\"leg_number\": 3, \"mode\": \"road\", \"from\":\
          \ \"Destination Port\", \"to\": destination, \"distance_km\": 80, \"transit_days\"\
          : 0.5}\n        ]\n        \n    total_dist = sum(float(l.get(\"distance_km\"\
          , 0)) for l in legs)\n    total_days = sum(float(l.get(\"transit_days\"\
          , 0)) for l in legs)\n    density = round(float(weight) / max(float(volume),\
          \ 0.1), 2)\n    \n    return {\n        \"origin\": str(origin),\n     \
          \   \"destination\": str(destination),\n        \"cargo_desc\": str(cargo_desc),\n\
          \        \"weight_kg\": float(weight),\n        \"volume_cbm\": float(volume),\n\
          \        \"cargo_density\": float(density),\n        \"temp_control\": str(temp_req),\n\
          \        \"hazmat_class\": str(hazmat),\n        \"incoterms\": str(incoterms),\n\
          \        \"urgency\": str(urgency),\n        \"deadline\": str(deadline),\n\
          \        \"total_distance_km\": float(total_dist),\n        \"estimated_transit_days\"\
          : float(total_days),\n        \"legs_count\": int(len(legs)),\n        \"\
          transport_modes\": list(set(l.get(\"mode\", \"sea\") for l in legs)),\n\
          \        \"master_spec_summary\": f\"Route: {origin} -> {destination} ({total_dist:.0f}\
          \ km, {total_days:.1f} days) | Cargo: {weight}kg / {volume}cbm ({density}\
          \ kg/cbm) | Temp: {temp_req} | Incoterms: {incoterms}\"\n    }\n"
