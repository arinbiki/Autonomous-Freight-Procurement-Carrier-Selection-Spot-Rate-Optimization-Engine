          \    \n    # Negotiating Leverage Ratio (Buyer BATNA vs Carrier Alternative)\n\
          \    leverage_ratio = round(buyer_batna / max(runner_up_bid, 1.0), 3)\n\
          \    leverage_rating = 'STRONG_BUYER_LEVERAGE' if zopa_width > 400.0 else\
          \ 'BALANCED_LEVERAGE'\n    \n    return {\n        'buyer_batna_usd': round(buyer_batna,\
          \ 2),\n        'carrier_walkaway_usd': round(carrier_walkaway, 2),\n   \
          \     'zopa_floor_usd': round(zopa_floor, 2),\n        'zopa_ceiling_usd':\
          \ round(zopa_ceiling, 2),\n        'zopa_width_usd': round(zopa_width, 2),\n\
